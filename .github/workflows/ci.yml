name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Syntax and ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: archlinux:base-devel
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git jq make shellcheck
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Syntax and ShellCheck
        run: make lint

  hermetic:
    name: Hermetic suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: archlinux:base-devel
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git jq make diffutils tar util-linux systemd
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run the suites as an unprivileged user
        run: |
          useradd --create-home builder
          chown -R builder .
          runuser -u builder -- env HOME=/home/builder make test-hermetic

  mutations:
    name: Mutation check, part ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Each job runs the part its place in the list gives it, so the parts
    # cover the whole list whatever its values. Every part must pass, and a
    # failure lets the others finish, so their results stay in the log.
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    container:
      image: archlinux:base-devel
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git jq make diffutils tar util-linux systemd
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Disable each safety predicate of this part in turn, as an unprivileged user
        run: |
          useradd --create-home builder
          chown -R builder .
          runuser -u builder -- env HOME=/home/builder bash tests/mutations.sh --part "$(( ${{ strategy.job-index }} + 1 ))/${{ strategy.job-total }}"

  package:
    name: Package build and privileged install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: archlinux:base-devel
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git jq diffutils util-linux libarchive
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Unprivileged package build and payload inspection
        run: |
          useradd --create-home builder
          chown -R builder .
          runuser -u builder -- env HOME=/home/builder bash tests/package.sh
      - name: Privileged install, dormant hook, upgrade and removal
        env:
          OMASECBOOT_DISPOSABLE_ROOT: "1"
        run: bash tests/container.sh
